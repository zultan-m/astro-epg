name: Generate Astro EPG

on:
  schedule:
    - cron: '5 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract old EPG
        shell: powershell
        run: |
          if (Test-Path "astro.xml.gz") {
            gzip -d astro.xml.gz
            Rename-Item astro.xml astro_old.xml -Force
          }

      - name: Run EXE
        shell: powershell
        run: |
          .\epg.exe

      - name: Compress EPG
        shell: powershell
        run: |
          gzip -9 -c astro.xml > astro.xml.gz

      - name: Commit changes
        shell: powershell
        run: |
          git config --global user.name "epg-bot"
          git config --global user.email "actions@github.com"

          git add astro.xml astro.xml.gz epg.log

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Auto update EPG, XML, GZ & log"
            git push
          }
