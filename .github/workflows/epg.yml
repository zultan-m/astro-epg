name: Generate Astro EPG

on:
  schedule:
    - cron: '5 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EXE
        shell: powershell
        run: |
          .\epg.exe

      - name: Compress XML
        shell: powershell
        run: |
          python -c "import gzip, shutil; f_in=open('astro.xml','rb'); f_out=gzip.open('astro.xml.gz','wb'); shutil.copyfileobj(f_in,f_out); f_out.close(); f_in.close()"

      - name: Commit files
        shell: powershell
        run: |
          git config --global user.name "epg-bot"
          git config --global user.email "actions@github.com"

          git add astro.xml astro.xml.gz epg.log

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Auto update EPG"
            git push
          }
